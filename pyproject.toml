[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opticps"
version = "0.1.0"
description = "Research framework comparing uniform, fixed-shaped and adaptive-shaped PAM4 on IM/DD optical links"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Theerayut Boonkird" }]
keywords = ["PAM4", "probabilistic shaping", "IM/DD", "CCDM", "optical communication"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "python-pptx>=1.0",
  "reportlab>=4.0",
  "h5py>=3.10",
]

[project.scripts]
opticps = "opticps.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pypdf>=5", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/opticps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running end-to-end tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["scripts/prebuild_rate_check.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/opticps/reporting/report.py" = ["E501"]
"tests/*" = ["E501", "B018"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/opticps"]

[[tool.mypy.overrides]]
module = ["pptx.*", "reportlab.*", "scipy.*", "matplotlib.*", "h5py.*"]
ignore_missing_imports = true
