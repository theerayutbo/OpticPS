# M-PAM profiles (config_schema_version 2). The PAM4 profiles stay in m8199b_profiles.yaml,
# whose raw bytes feed experiment_id and must not change.
# Every value here is a declared starting point for offline simulation, not proof that an optical
# link supports these speeds. M8199B limits: docs/HARDWARE_COMPATIBILITY.md.
config_schema_version: 2
common:
  seed: 42
  block_length: 1024
  pulse: {shape: nrz, roll_off: 0.35, boundary: circular}
  data_out: DataOut1
  decimals: 9
  sample_rate_Sa_per_s: 224.0e9
  constraint_protocol: fixed_peak   # same drive alphabet for every waveform of a group
  evidence: simulated               # simulated | mock | measured | analytical
# The best-fixed baseline, declared before any test data is seen. Loaded through
# load_mpam_config; the loader refuses a file whose deficits differ from the code's pinned
# values, and reported baselines are built only from them (never from a run-time argument).
fixed_menu:
  members: [Uniform, Inner, Outer]
  entropy_deficits_bits: [0.12, 0.28]   # below log2 M; M = 4 reads PS70, PS80 and Outer70
adaptive:
  # Design point and training capture of the simulated adaptive / best-fixed selection.
  metric: bmd
  training_samples: 40000        # per acquisition at PAM4; scaled by M / 4
  training_acquisitions: 2
  design_rate_bpcu: {8: 1.5, 16: 2.0}   # bit per channel use, sets the design PSNR
protocol_A:        # v1.2 symbol rates and lengths, any order
  profiles:
    - {name: A_8GBd, symbol_rate_Bd: 8.0e9, symbols: 32768}
    - {name: A_56GBd, symbol_rate_Bd: 56.0e9, symbols: 65536}
protocol_B:        # nominal 112 Gb/s label rate: baud = 112e9 / log2 M, sps = 224e9 / baud
  nominal_bit_rate_bps: 112.0e9
  samples_per_symbol: {2: 2, 4: 4, 8: 6, 16: 8}
  symbols: {2: 131072, 4: 65536, 8: 43008, 16: 32768}
