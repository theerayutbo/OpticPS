    it (this phase edits no bound file)., b: R13's 2 km FAIL stands as the result of the pre-registered test of
    H1 (the B2B-calibrated small-signal surrogate transfers); H1 is refuted at 2 km and no 10 km result can rehabilitate
    it., c: 'H2 (D1) is a different hypothesis, formed after seeing 2 km; tested at most once, on 10 km, under an
    R14 freeze; if H2 fails, no third hypothesis gets a fresh holdout from this dataset.', d: 'Ceiling: VALIDATED
    is never returned; a 10 km PASS, DISCRIMINATING is PARTIAL, INCONCLUSIVE, confounded by a coincident settings
    change, a mild low-pass, chirp, wavelength, fibre type and the grid; the law''s seat stays unidentified.', e: BER
    and SER stay REFERENCE_SEQUENCE_MISSING., f: 'Limits, scenarios and rule use B2B and 2 km only; the 10 km file
    is not touched.', d12_spread_term: The per-scenario model-spread term of D12 is approved by Aria for this study
    only; it is a structural change that needs explicit owner approval before any R14 freeze.}
