provenance: {status: 'ASSUMED_G652D scenarios: hypotheses; the fibre type is UNKNOWN', dispersion: 'The
    grid is 0 to 3 in steps of 0.5, 3.25 to 6.25 in steps of 0.25 and 6.352 ps/(nm km). 6.352 is the largest
    |D| of the ITU-T G.652.D limit envelope, 1260 to 1360 nm in 1 nm steps, from opticps.optical_channel.fiber.g652d_dispersion_limits
    (Rec. ITU-T G.652 08/2024 Eq. 6-2, 6-3): SPECIFICATION_LIMIT. The other points are a grid refined
    in steps after power studies showed that a true D between grid points FAILs at 10 km (a FAIL dominated
    by the grid): 1.5, then 0.5, then 0.25 at high D. The sign of D does not matter for zero chirp.',
  noise_factor: 'Noise standard deviation relative to B2B: 1, 1.5, 2.2. It stands for any SNR change (loss,
    re-tuning, launch power: UNKNOWN). The amplitude itself is removed by the gain-invariant map of plan
    R12.3 and is reported, not tested.', noise_origin: 'noise_through_fibre false: noise added after the
    fibre; true: the noise crosses the fibre like the signal. The B2B split is unidentifiable, so both
    bounds are scenarios.', wavelength: UNKNOWN (O-band only); 1310 nm enters only as lambda^2 of the
    response, chirp: 'UNKNOWN; all scenarios assume zero (MODEL GAP: CHIRP)'}
